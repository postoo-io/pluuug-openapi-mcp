[project]
name = "pluuug-openapi-mcp"
version = "0.1.0"
description = "MCP server for pluuug openapi (with HMAC body signing built-in)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pluuug", email = "support@pluuug.com" }]
keywords = ["mcp", "openapi", "pluuug", "claude", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "awslabs.openapi-mcp-server>=0.2",
    "fastmcp<3.0.0",  # awslabs is incompatible with fastmcp 3.x as of 2026-03
    "httpx>=0.27",
]

[project.scripts]
pluuug-openapi-mcp = "pluuug_openapi_mcp.cli:main"

[project.urls]
Homepage = "https://openapi.pluuug.com/docs/"
Documentation = "https://openapi.pluuug.com/docs/integrations/mcp"
Repository = "https://github.com/postoo-io/pluuug-openapi-mcp"
Issues = "https://github.com/postoo-io/pluuug-openapi-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pluuug_openapi_mcp"]
